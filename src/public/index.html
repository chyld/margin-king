<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Margin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.5 1.5 0 0 1 0 2.1l-6.1 6.1a1.5 1.5 0 0 1-2.1 0z"/><circle cx="8" cy="8" r="1.4"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h10"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4.5 9.5A8 8 0 1 1 4 13"/><path d="M4 4.5v5h5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.3 0 2-.8 2-1.8 0-1.4-1.2-1.6-1.2-2.8 0-1 .8-1.7 1.8-1.7h2.1c2.2 0 3.8-1.6 3.8-3.8C20.5 6.6 16.7 3.5 12 3.5z"/><circle class="dot dot-1" cx="7.5" cy="11" r="1.5"/><circle class="dot dot-2" cx="10" cy="7.3" r="1.5"/><circle class="dot dot-3" cx="14.5" cy="7.3" r="1.5"/><circle class="dot dot-4" cx="17" cy="11" r="1.5"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" aria-label="Notes">
      <div class="side-head">
        <a class="logo" href="/" title="Margin home"><img src="/favicon.svg" alt="" width="28" height="28"><span>Margin</span></a>
        <button class="icon-btn hide-sidebar" type="button" title="Hide sidebar" aria-label="Hide sidebar"><svg class="icon"><use href="#i-panel"/></svg></button>
        <button class="icon-btn drawer-close" type="button" title="Close" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <button class="btn primary new-note" type="button"><svg class="icon"><use href="#i-plus"/></svg>New note</button>
      <label class="field"><svg class="icon"><use href="#i-tag"/></svg><select class="tag-filter" aria-label="Filter by tag"></select></label>
      <label class="field"><svg class="icon"><use href="#i-search"/></svg><input class="search" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off"></label>
      <div class="trash-head" hidden><span>Trash</span><button class="btn danger small empty-trash" type="button">Empty trash</button></div>
      <ul class="note-list"></ul>
      <div class="side-foot">
        <button class="btn ghost trash-toggle" type="button"></button>
        <span class="me"><span class="avatar"></span><span class="me-name"></span></span>
        <button class="icon-btn logout" type="button" title="Log out" aria-label="Log out"><svg class="icon"><use href="#i-logout"/></svg></button>
      </div>
    </aside>
    <div class="backdrop"></div>

    <main class="main">
      <header class="menubar">
        <button class="icon-btn menu" type="button" title="Notes" aria-label="Show notes"><svg class="icon"><use href="#i-menu"/></svg></button>
        <button class="icon-btn show-sidebar" type="button" title="Show sidebar" aria-label="Show sidebar"><svg class="icon"><use href="#i-panel"/></svg></button>
        <div class="toolgroup">
          <button class="tool save" type="button" data-state="saved"><svg class="icon"><use href="#i-save"/></svg><span class="save-dot"></span></button>
          <button class="switch mode-switch" type="button" aria-label="Switch render / raw (Ctrl+E)"><span class="thumb"></span><span class="glyph g-left"><svg class="icon"><use href="#i-eye"/></svg></span><span class="glyph g-right"><svg class="icon"><use href="#i-code"/></svg></span></button>
          <button class="switch font-switch" type="button" aria-label="Monospace or proportional font"><span class="thumb"></span><span class="glyph g-left aa-mono">Aa</span><span class="glyph g-right aa-prop">Aa</span></button>
          <button class="tool palette" type="button" title="Formatting" aria-label="Formatting"><svg class="icon"><use href="#i-palette"/></svg></button>
        </div>
        <div class="tags">
          <span class="tag-chips"></span>
          <span class="tag-input"><input class="tag-box" type="text" placeholder="+ tag" aria-label="Add a tag" autocomplete="off" spellcheck="false" autocapitalize="off"><ul class="suggestions" role="listbox" hidden></ul></span>
        </div>
        <div class="spacer"></div>
        <button class="tool tile trash-note" type="button" title="Move to trash" aria-label="Move to trash"><svg class="icon"><use href="#i-trash"/></svg></button>
      </header>

      <div class="trash-banner" hidden>
        <svg class="icon"><use href="#i-trash"/></svg>
        <span class="banner-text">This note is in the trash.</span>
        <button class="btn banner-restore" type="button"><svg class="icon"><use href="#i-restore"/></svg>Restore</button>
        <button class="btn danger banner-delete" type="button">Delete forever</button>
      </div>

      <div class="paper-wrap" hidden><div class="paper"><div class="editor"></div></div></div>

      <div class="empty-state" hidden>
        <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
        <h1>Pick a note, or start a fresh one</h1>
        <p>Your notes are on the left.</p>
        <button class="btn primary empty-new" type="button"><svg class="icon"><use href="#i-plus"/></svg>New note</button>
      </div>
    </main>
    <div class="toasts" aria-live="polite"></div>
  </div>
</body>
</html>
